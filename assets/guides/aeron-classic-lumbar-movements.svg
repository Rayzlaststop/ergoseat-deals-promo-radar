<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title desc">
  <title id="title">Aeron Classic: two lumbar assemblies, different movements</title>
  <desc id="desc">Crandall's guide describes a sliding lumbar pad with height movement and a PostureFit assembly with pressure adjustment but no height movement. Identify the installed assembly before asking for a demonstration. This is an explanatory diagram, not a photograph or a chair test.</desc>
  <rect width="600" height="720" rx="24" fill="#f0f6f3"/>
  <g font-family="Arial, sans-serif" fill="#173e37">
    <text x="32" y="42" font-size="17" font-weight="700" letter-spacing="1">DESKCHAIRDEALS · CONFIGURATION CHECK</text>
    <text x="32" y="92" font-size="30" font-weight="700">Name the support before testing</text>
    <text x="32" y="126" font-size="23">Aeron Classic · two different assemblies</text>
    <rect x="26" y="154" width="548" height="220" rx="18" fill="#fff" stroke="#bdd4ca"/>
    <text x="48" y="194" font-size="29" font-weight="700">Sliding lumbar pad</text>
    <path d="M85 238v96m-12-84 12-12 12 12m-24 72 12 12 12-12" fill="none" stroke="#14756a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="111" y="251" width="48" height="67" rx="17" fill="#d5ebe2" stroke="#14756a" stroke-width="3"/>
    <text x="190" y="250" font-size="24" font-weight="700">Height movement</text>
    <text x="190" y="287" font-size="23">Pad slides up and down.</text>
    <text x="190" y="323" font-size="23">Its two sides differ.</text>
    <rect x="26" y="396" width="548" height="220" rx="18" fill="#fff" stroke="#bdd4ca"/>
    <text x="48" y="436" font-size="29" font-weight="700">PostureFit</text>
    <circle cx="120" cy="518" r="35" fill="#d5ebe2" stroke="#14756a" stroke-width="3"/>
    <path d="M120 495v22l16 12" fill="none" stroke="#14756a" stroke-width="5" stroke-linecap="round"/>
    <text x="190" y="492" font-size="24" font-weight="700">Pressure adjustment</text>
    <text x="190" y="529" font-size="23">Dial changes pressure.</text>
    <text x="190" y="565" font-size="23">No height movement here.</text>
    <text x="32" y="656" font-size="22" font-weight="700">Different movement does not prove a defect.</text>
    <text x="32" y="688" font-size="18">Source: Crandall lumbar guide · read 30 October 2026</text>
  </g>
</svg>
