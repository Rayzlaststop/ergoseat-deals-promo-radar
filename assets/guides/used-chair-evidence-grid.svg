<svg xmlns="http://www.w3.org/2000/svg" width="720" height="950" viewBox="0 0 720 950" role="img" aria-labelledby="t d">
<title id="t">Keep each claim with its own evidence</title>
<desc id="d">Record a size marking as size evidence, a working control as evidence of that movement, and a component date as a date for that component. None establishes every property of the chair.</desc>
<rect width="720" height="950" rx="28" fill="#f1f4fa"/>
<g font-family="Arial,sans-serif" fill="#20384d">
<text x="40" y="65" font-size="36" font-weight="700">One claim. Its own evidence.</text>
<g fill="white" stroke="#c8d5df" stroke-width="2"><rect x="36" y="105" width="648" height="215" rx="18"/><rect x="36" y="345" width="648" height="215" rx="18"/><rect x="36" y="585" width="648" height="235" rx="18"/></g>
<g font-size="34" font-weight="700"><text x="62" y="156">A size marking</text><text x="62" y="396">A working control</text><text x="62" y="636">A date on a component</text></g>
<g font-size="31"><text x="62" y="207">Record the frame size.</text><text x="62" y="253">Check generation separately.</text><text x="62" y="447">Record that movement.</text><text x="62" y="493">Check other controls separately.</text><text x="62" y="687">Record the part and its date.</text><text x="62" y="733">Ask about replacement history.</text><text x="62" y="779">Whole-chair age can stay unknown.</text></g>
<text x="40" y="878" font-size="31">Missing evidence stays unresolved.</text><text x="40" y="922" font-size="29">A buying worksheet, not an authentication.</text>
</g></svg>
