<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="t d"><title id="t">Verify the chair behind the listing</title><desc id="d">Identify the chair, demonstrate the relevant movements, and keep unanswered questions unresolved.</desc><rect width="1000" height="760" rx="28" fill="#eaf3ef"/><g font-family="Arial,sans-serif" fill="#173f38"><text x="56" y="80" font-size="44" font-weight="700">Verify the chair behind the listing</text><g fill="white" stroke="#b1cec1" stroke-width="2"><rect x="56" y="125" width="888" height="140" rx="20"/><rect x="56" y="305" width="888" height="140" rx="20"/><rect x="56" y="485" width="888" height="140" rx="20"/></g><g font-size="36" font-weight="700"><text x="88" y="178">Identify the exact chair</text><text x="88" y="358">Demonstrate the claimed controls</text><text x="88" y="538">Keep a record for that listing</text></g><g font-size="30"><text x="88" y="227">Model, generation, frame and installed options</text><text x="88" y="407">Show the control and the movement it produces</text><text x="88" y="587">Shown · Contradicted · Unresolved</text></g><g font-size="35" text-anchor="middle"><text x="500" y="297">↓</text><text x="500" y="477">↓</text></g><text x="56" y="690" font-size="28">DeskChairDeals editorial method · not a product certification</text></g></svg>