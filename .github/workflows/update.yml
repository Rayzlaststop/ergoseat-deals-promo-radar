name: Refresh official offer data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify configuration drives scraper and builder
        run: python verify.py
      - name: Collect only allowed public official pages
        run: python scraper.py
      - name: Build the static site from the fresh snapshot
        run: python build.py
      - name: Commit updated offer snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified official chair offers"
            git push
          fi
      # Publishing step. The live Cloudflare Pages project is a direct-upload
      # project (API source = null), so it is only updated by an explicit
      # wrangler deploy. This step runs that deploy, but stays silent until the
      # repository owner adds the CLOUDFLARE_API_TOKEN secret; without it the
      # workflow still collects and commits, it just does not publish.
      - name: Publish to Cloudflare Pages when the deploy secret exists
        if: ${{ env.HAS_CLOUDFLARE_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bcb87a6e013281834d6988338f6dec74
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not set; collecting only, not publishing."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy site --project-name ergoseat-deals
