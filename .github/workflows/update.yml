name: Refresh official offer data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify configuration drives scraper and builder
        run: python verify.py
      - name: Collect only allowed public official pages
        run: python scraper.py
      - name: Commit updated offer snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified official chair offers"
            git push
          fi
